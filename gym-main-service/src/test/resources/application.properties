# ===== Profile-specific test config =====
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
# ===== H2 in-memory DB =====
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# ===== Disable Eureka =====
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
# ===== Embedded ActiveMQ (producer mocked anyway) =====
spring.activemq.broker-url=vm://localhost?broker.persistent=false
gym.messaging.workload-queue=workload.queue
gym.messaging.workload-dlq=workload.dlq
# ===== JWT (CORRECT prefix: security.jwt) =====
security.jwt.secret=dGVzdFNlY3JldEtleUZvckp3dEhTMjU2TXVzdEJlTG9uZ0Vub3VnaDEyMzQ1Ng==
security.jwt.expiration=3600000
# ===== Brute force =====
security.brute-force.max-attempts=3
security.brute-force.block-duration-minutes=5