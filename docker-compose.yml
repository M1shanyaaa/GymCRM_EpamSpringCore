services:
  postgres:
    image: postgres:16
    container_name: gym-postgres
    environment:
      POSTGRES_USER: gym_user
      POSTGRES_PASSWORD: gym_pass
    ports:
      - "5432:5432"
    volumes:
      - gym_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  activemq:
    image: apache/activemq-classic:5.18.3
    container_name: gym-activemq
    ports:
      - "61616:61616"   # JMS protocol
      - "8161:8161"     # Web Console
    environment:
      ACTIVEMQ_CONNECTION_USER: admin
      ACTIVEMQ_CONNECTION_PASSWORD: admin

  # ===== NEW: MongoDB for workload aggregation =====
  mongodb:
    image: mongo:7
    container_name: gym-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_user
      MONGO_INITDB_ROOT_PASSWORD: mongo_pass
      MONGO_INITDB_DATABASE: gym_workload
    volumes:
      - gym_mongodata:/data/db

volumes:
  gym_pgdata:
  gym_mongodata: